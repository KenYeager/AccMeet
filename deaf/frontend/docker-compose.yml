services:
  deaf-frontend:
    image: node:20-alpine
    container_name: deaf_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - deaf_frontend_node_modules:/app/node_modules
    environment:
      # Server-side (Next.js rewrite, runs inside this container) — must
      # reach the host, where deaf/backend runs as a bare process.
      INTERNAL_API_URL: http://host.docker.internal:8003
      # Browser-facing — the browser runs on the host, so localhost is correct.
      NEXT_PUBLIC_API_URL: http://localhost:8003
      NEXT_PUBLIC_WS_URL: ws://localhost:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  deaf_frontend_node_modules:
    name: deaf_frontend_node_modules
